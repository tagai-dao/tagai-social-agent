[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagai-social-agent"
version = "0.1.0"
description = "Persistent browser-feed collector and TagAI callout importer for FOMO, GMGN, and Pump.fun."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48,<2", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
include = ["tagagent*"]
